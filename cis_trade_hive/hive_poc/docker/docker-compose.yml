version: '3.8'

# Hive POC - Local Hive Setup with ACID Support for ORC Tables
# Database: gmp_cis
# Supports: INSERT, UPDATE, DELETE on ORC managed tables

services:
  # PostgreSQL for Hive Metastore backend
  metastore-db:
    image: postgres:13-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - hive-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Hive Metastore Service
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
    ports:
      - "9083:9083"
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    networks:
      - hive-net
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9083"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # HiveServer2 with full ACID support
  hiveserver2:
    image: apache/hive:3.1.3
    container_name: hiveserver2
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./init-db.sql:/opt/hive/init-db.sql:ro
    networks:
      - hive-net
    restart: unless-stopped

networks:
  hive-net:
    driver: bridge
    name: hive-network

volumes:
  metastore-db-data:
    name: hive-metastore-data
  hive-warehouse:
    name: hive-warehouse-data
