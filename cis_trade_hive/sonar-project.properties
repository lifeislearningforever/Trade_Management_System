# SonarQube scanner configuration for CIS Trade Hive.
#
# Config only -- no CI wiring yet. Run manually once you have a server/token:
#   sonar-scanner \
#     -Dsonar.host.url=<your SonarQube server URL> \
#     -Dsonar.login=<your token>
# (or export SONAR_HOST_URL / SONAR_TOKEN and drop both -D flags)

sonar.projectKey=cis_trade_hive
sonar.projectName=CIS Trade Hive
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Django/Kudu app -- Python only, no separate front-end build (templates/static
# are plain Bootstrap/jQuery, not a JS project with its own linting).
sonar.language=py

# Mirrors .coveragerc's omit list plus generated/vendored/non-source directories.
sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/venv/**,\
  **/.venv/**,\
  **/static/**,\
  **/templates/**,\
  **/htmlcov/**,\
  **/node_modules/**,\
  **/edge_jobs_py36/**,\
  manage.py,\
  **/wsgi.py,\
  **/asgi.py

# Test code is scanned separately from `sonar.sources` so it doesn't count
# toward main-code duplication/complexity metrics.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test_*.py
sonar.exclusions=${sonar.exclusions},**/tests/**,**/test_*.py

# Coverage: generate with `pytest --cov=. --cov-report=xml` (see .coveragerc)
# before running the scanner, so this file exists.
sonar.python.coverage.reportPaths=coverage.xml

# edge_jobs_py36 is a Python 3.6-compatible fork of select scripts (see
# README.md there) -- excluded above since it's near-duplicate code by design,
# not a maintainability issue Sonar should flag.
